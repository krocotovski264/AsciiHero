# Builds the Android APK from Unity/ on GitHub's servers (game-ci, Unity version from ProjectVersion.txt).
# Needs three repository secrets: UNITY_LICENSE (contents of Unity_lic.ulf), UNITY_EMAIL, UNITY_PASSWORD.
# The APK is published to Releases (tag latest-apk) as a plain file, and kept as a run artifact too.
name: Android APK

on:
  push:
    branches: [main, unity-port, refactor/architecture]
    paths: ['Unity/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['Unity/**', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Check Unity license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -z "$UNITY_LICENSE" ] && missing="$missing UNITY_LICENSE"
          [ -z "$UNITY_EMAIL" ] && missing="$missing UNITY_EMAIL"
          [ -z "$UNITY_PASSWORD" ] && missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Add repository secrets:$missing (Settings -> Secrets and variables -> Actions). See README, section 'APK через GitHub Actions'."
            exit 1
          fi

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Unity/Library
          key: Library-Android-${{ hashFiles('Unity/Assets/**', 'Unity/Packages/**', 'Unity/ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity
          unityVersion: auto
          targetPlatform: Android
          buildName: AsciiHero
          buildMethod: AsciiHero.Editor.CIBuild.BuildAndroid
          androidExportType: androidPackage
          androidVersionCode: ${{ github.run_number }}
          versioning: None

      - uses: actions/upload-artifact@v4
        with:
          name: AsciiHero-apk
          path: build/Android
          retention-days: 14

      # Publish only trusted branch builds, never arbitrary pull requests.
      - name: Publish APK to Releases
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/unity-port' || github.ref == 'refs/heads/refactor/architecture')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(find build/Android -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" AsciiHero.apk
          if [ "$GITHUB_REF_NAME" = "refactor/architecture" ]; then
            TAG=latest-dev-apk
            TITLE="Последняя экспериментальная сборка APK"
          else
            TAG=latest-apk
            TITLE="Последняя сборка APK"
          fi
          NOTES="Сборка №${GITHUB_RUN_NUMBER} из ветки ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AsciiHero.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" AsciiHero.apk --target "$GITHUB_SHA" --prerelease --title "$TITLE" --notes "$NOTES"
          fi

      # the Unity image and build output fill the runner's disk; without this the cache save at the end fails
      - name: Free space before saving the cache
        if: always()
        run: |
          docker system prune -af || true
          sudo rm -rf build || true
          df -h /
