# Builds the Android APK from Unity/ on GitHub's servers (game-ci, Unity version from ProjectVersion.txt).
# Needs three repository secrets: UNITY_LICENSE (contents of Unity_lic.ulf), UNITY_EMAIL, UNITY_PASSWORD.
# The APK is published to Releases (tag latest-apk) as a plain file, and kept as a run artifact too.
name: Android APK

on:
  push:
    branches: [main, unity-port, refactor/architecture]
    paths: ['Unity/**', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: android-latest-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Check Unity license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -z "$UNITY_LICENSE" ] && missing="$missing UNITY_LICENSE"
          [ -z "$UNITY_EMAIL" ] && missing="$missing UNITY_EMAIL"
          [ -z "$UNITY_PASSWORD" ] && missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Add repository secrets:$missing (Settings -> Secrets and variables -> Actions). See README, section 'APK через GitHub Actions'."
            exit 1
          fi

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set build version and verify source
        id: version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          VERSION="0.1.$((GITHUB_RUN_NUMBER - 137))"
          export VERSION
          python3 - <<'PY'
          import os, pathlib, re
          p = pathlib.Path("Unity/Assets/Scripts/Game.cs")
          s, n = re.subn(r'(public const string VERSION = "beta )\d+\.\d+\.\d+( · Unity";)', lambda m: m[1]+os.environ["VERSION"]+m[2], p.read_text())
          assert n == 1
          p.write_text(s)
          PY
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION from $GITHUB_SHA"

      - uses: actions/cache@v4
        with:
          path: Unity/Library
          key: Library-Android-${{ hashFiles('Unity/Assets/**', 'Unity/Packages/**', 'Unity/ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity
          unityVersion: auto
          targetPlatform: Android
          buildName: AsciiHero
          buildMethod: AsciiHero.Editor.CIBuild.BuildAndroid
          androidExportType: androidPackage
          androidVersionCode: ${{ github.run_number }}
          versioning: Custom
          version: ${{ steps.version.outputs.version }}

      - name: Prepare versioned APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APK=$(find build/Android -name '*.apk' -print -quit)
          test -n "$APK"
          mkdir -p release
          cp "$APK" "release/AsciiHero-$VERSION.apk"
          sha256sum "release/AsciiHero-$VERSION.apk"
          printf 'version=%s\ncommit=%s\n' "$VERSION" "$GITHUB_SHA" > release/build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AsciiHero-${{ steps.version.outputs.version }}
          path: release/
          retention-days: 14

      # Publish only trusted branch builds, never arbitrary pull requests.
      - name: Publish APK to Releases
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/unity-port' || github.ref == 'refs/heads/refactor/architecture')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=latest-apk
          TITLE="Последняя сборка APK"
          VERSION="${{ steps.version.outputs.version }}"
          APK="release/AsciiHero-$VERSION.apk"
          NOTES="Версия $VERSION, сборка №${GITHUB_RUN_NUMBER}, ветка ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA}."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" release/build-info.txt --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              case "$asset" in
                "AsciiHero-$VERSION.apk") ;;
                AsciiHero*.apk) gh release delete-asset "$TAG" "$asset" --yes ;;
              esac
            done
          else
            gh release create "$TAG" "$APK" release/build-info.txt --target "$GITHUB_SHA" --prerelease --title "$TITLE" --notes "$NOTES"
          fi

      # the Unity image and build output fill the runner's disk; without this the cache save at the end fails
      - name: Free space before saving the cache
        if: always()
        run: |
          docker system prune -af || true
          sudo rm -rf build || true
          df -h /
